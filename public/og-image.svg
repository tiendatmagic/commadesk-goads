<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001436"/>
      <stop offset="50%" stop-color="#001c4c"/>
      <stop offset="100%" stop-color="#0a2f6c"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff6400" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-blue-glow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0057e1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0057e1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg-grad)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-blue-glow)"/>

  <!-- Subtle Pattern -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Content -->
  <g transform="translate(80, 80)">
    <!-- Brand Badge -->
    <rect width="360" height="42" rx="21" fill="rgba(255,100,0,0.2)" stroke="#ff6400" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#ff6400"/>
    <text x="40" y="26" fill="#ffaa40" font-size="14" font-weight="bold" font-family="sans-serif" letter-spacing="1.5">GOADS MEDIA TECHNOLOGY</text>

    <!-- Main Title -->
    <text x="0" y="140" fill="#ffffff" font-size="54" font-weight="900" font-family="sans-serif" letter-spacing="-1">
      PHỦ RỘNG HIỆU QUẢ
    </text>
    <text x="0" y="205" fill="#ff7a1a" font-size="54" font-weight="900" font-family="sans-serif" letter-spacing="-1">
      LAN TỎA THÔNG ĐIỆP
    </text>

    <!-- Subtitle -->
    <text x="0" y="270" fill="#cfd9ea" font-size="24" font-family="sans-serif" font-weight="400">
      Màn Hình LED Trên Xe Máy • Đội Xe Diễu Hành • Xe 4 Bánh Mobile Billboard
    </text>
    <text x="0" y="315" fill="#8ba0c2" font-size="20" font-family="sans-serif" font-weight="400">
      Ứng dụng AI Camera đo lường lượt tiếp cận &amp; Định vị GPS hành trình
    </text>

    <!-- Footer info -->
    <line x1="0" y1="380" x2="1040" y2="380" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="0" y="425" fill="#ffffff" font-size="18" font-family="sans-serif" font-weight="600">
      CÔNG TY CỔ PHẦN CÔNG NGHỆ TRUYỀN THÔNG GOADS
    </text>
    <text x="1040" y="425" fill="#ff7a1a" font-size="18" font-family="sans-serif" font-weight="700" text-anchor="end">
      www.goads.vn • Hotline: 094 531 89 68
    </text>
  </g>
</svg>
